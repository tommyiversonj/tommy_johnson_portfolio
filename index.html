    <!-- Prevents a light/dark theme flash on load by applying the stored
         preference before first paint, ahead of React mounting. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>

    <!-- Analytics & pixel tracking (Ad-Ready)

         third-party network calls until real IDs are configured, and load
         after the page goes idle so they never compete with LCP/TBT.
         initAnalytics() runs from src/main.jsx on app mount.
